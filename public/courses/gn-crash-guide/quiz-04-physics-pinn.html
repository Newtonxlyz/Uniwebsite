(async () => {
  const courseId = 'gn-crash-guide';
  CourseInit.runInline(courseId, {"course":{"courseId":"gn-crash-guide","title":"GNN + Transformer + 物理约束：碰撞仿真降阶实战","subtitle":"图神经网络 + 物理感知 Transformer · 系统掌握 AI 碰撞降阶的完整技术栈","level":"intermediate","duration":"14 小时","estimatedHours":14,"audience":"AI 工程师 · CAE 仿真 · 碰撞降阶研究者","objectives":["理解 GNN 消息传递与 Transformer 注意力的协同","能从零搭建 MeshGraphNet / GNS 风格的弹簧-质点仿真器","会选 PINN / GNN / Transformer / 混合架构的适用场景","能评估 rollout 误差 · 物理守恒 · 接触建模的工业指标"],"prerequisites":["Python 基础","机器学习基础","PyTorch 入门"]},"chapters":[{"id":"01-crash-basics","title":"碰撞仿真与降阶基础","summary":"理解传统有限元的局限，掌握碰撞仿真的精度/速度矛盾","slug":"01-crash-basics","subtitle":"为什么要做碰撞仿真降阶","estimatedMinutes":20,"level":"intermediate"},{"id":"02-gnn-core","title":"图神经网络（GNN）核心","summary":"掌握图卷积/注意力/归纳学习三大 GNN 范式及其在物理仿真中的作用","slug":"02-gnn-core","subtitle":"消息传递机制详解","estimatedMinutes":25,"level":"intermediate"},{"id":"03-transformer","title":"Transformer 与长程依赖","summary":"理解注意力机制、Graph Transformer 与物理感知 Transformer (Transolver)","slug":"03-transformer","subtitle":"注意力机制基础","estimatedMinutes":20,"level":"intermediate"},{"id":"04-physics-pinn","title":"物理约束与 PINN","summary":"将物理定律嵌入神经网络损失函数，构建 PINN/PhyGNNet","slug":"04-physics-pinn","subtitle":"物理信息神经网络（PINN）基础","estimatedMinutes":25,"level":"intermediate"},{"id":"05-hybrid-frontend","title":"混合架构与前沿方法","summary":"从 GNS/MeshGraphNet 到 GNN+Transformer 混合架构的实战路径","slug":"05-hybrid-frontend","subtitle":"GNS & MeshGraphNet：DeepMind的经典","estimatedMinutes":25,"level":"intermediate"},{"id":"06-tools-datasets","title":"工具框架与数据集","summary":"掌握 PyG/DGL/JAX/ΦFlow 等工具栈与仿真数据集","slug":"06-tools-datasets","subtitle":"PyTorch Geometric 入门","estimatedMinutes":20,"level":"intermediate"},{"id":"07-spring-mass","title":"实战：弹簧-质点系统","summary":"从 0 到 1 实现弹簧-质点 GNN 仿真器","slug":"07-spring-mass","subtitle":"问题定义与物理建模","estimatedMinutes":25,"level":"intermediate"}]}, {"courseId":"gn-crash-guide","cards":[{"id":"fc-01","front":"什么是碰撞仿真降阶模型（ROM）？","back":"将高维物理系统状态映射到低维潜空间，在潜空间中进行动力学演化再映射回物理空间，以更低的计算成本提供足够准确的仿真预测。","chapterId":"01-crash-basics","tags":["碰撞仿真与降阶基"]},{"id":"fc-02","front":"GNN替代模型相比传统FEM的推理速度提升约多少？","back":"通常可达100-1000倍加速。","chapterId":"01-crash-basics","tags":["碰撞仿真与降阶基"]},{"id":"fc-03","front":"为什么CNN不适合处理不规则网格？","back":"因为不规则网格中节点邻居数量不固定、排列顺序不固定（缺乏平移不变性）、复杂几何形状难以用规则网格表示，而CNN依赖固定的卷积核和规则网格。","chapterId":"01-crash-basics","tags":["碰撞仿真与降阶基"]},{"id":"fc-04","front":"GNN适合处理不规则网格的核心优势有哪些？","back":"1) 排列不变性；2) 局部归纳偏置（消息传递机制天然建模近邻相互作用）；3) 权重共享；4) 灵活的输入格式（节点/边/全局特征）。","chapterId":"01-crash-basics","tags":["碰撞仿真与降阶基"]},{"id":"fc-05","front":"AI降阶模型和FEM是什么关系？","back":"互补关系而非替代关系。FEM提供高精度训练数据，AI模型提供快速推理，用于大规模参数扫描、实时预测等FEM成本过高的场景。","chapterId":"01-crash-basics","tags":["碰撞仿真与降阶基"]},{"id":"fc-06","front":"消息传递神经网络（MPNN）的两个核心步骤是什么？","back":"1) 消息构造：根据源节点、目标节点和边特征计算消息；2) 聚合与更新：聚合所有邻居消息并更新节点状态。","chapterId":"02-gnn-core","tags":["图神经网络（GN"]},{"id":"fc-07","front":"什么是GNN的\"过度平滑\"问题？","back":"当GNN层数过多时，所有节点的特征会变得越来越相似，失去区分度的现象。","chapterId":"02-gnn-core","tags":["图神经网络（GN"]},{"id":"fc-08","front":"GCN的核心公式是什么？","back":"H^(k+1) = σ(D̃^-1/2 Ã D̃^-1/2 H^(k) W^(k))，其中Ã = A + I是加了自环的邻接矩阵，D̃是对应的度矩阵。","chapterId":"02-gnn-core","tags":["图神经网络（GN"]},{"id":"fc-09","front":"GCN的主要局限是什么？","back":"对所有邻居平等看待（权重由度数决定），无法区分不同邻居的重要性；是直推式学习，需要完整图结构。","chapterId":"02-gnn-core","tags":["图神经网络（GN"]},{"id":"fc-10","front":"GAT相比GCN的核心改进是什么？","back":"引入注意力机制，通过学习注意力系数来自适应地衡量每个邻居的重要性。","chapterId":"02-gnn-core","tags":["图神经网络（GN"]},{"id":"fc-11","front":"GraphSAGE的核心思想是什么？","back":"通过\"采样+聚合\"的方式，学习聚合函数而非节点嵌入本身，支持归纳式学习，能泛化到新节点和大规模图。","chapterId":"02-gnn-core","tags":["图神经网络（GN"]},{"id":"fc-12","front":"Encoder-Processor-Decoder架构的三个组件各自负责什么？","back":"Encoder：将物理特征映射到潜空间；Processor：多层消息传递更新潜特征；Decoder：将潜特征映射回物理输出。","chapterId":"02-gnn-core","tags":["图神经网络（GN"]},{"id":"fc-13","front":"为什么物理仿真GNN通常预测状态变化量而非下一状态？","back":"1) 数值稳定性更好；2) 有更好的归纳偏置（平凡解为0，即状态不变）；3) 网络只需学习\"扰动\"，更易于训练。","chapterId":"02-gnn-core","tags":["图神经网络（GN"]},{"id":"fc-14","front":"什么是自回归推演（rollout）？它的主要挑战是什么？","back":"自回归推演是指每一步的输出作为下一步的输入，逐步递推进行长时间仿真。主要挑战是误差累积——每步的小误差会逐步放大。","chapterId":"02-gnn-core","tags":["图神经网络（GN"]},{"id":"fc-15","front":"自注意力机制的核心公式是什么？","back":"Attention(Q, K, V) = softmax(QK^T/√d_k) V，其中Q是查询、K是键、V是值，d_k是键的维度。","chapterId":"03-transformer","tags":["Transfor"]},{"id":"fc-16","front":"为什么物理仿真需要Transformer？","back":"纯GNN受限于局部消息传递，捕捉长程依赖需要很多层（易过度平滑），而Transformer的全局注意力可以直接建模远距离节点间的相互作用。","chapterId":"03-transformer","tags":["Transfor"]},{"id":"fc-17","front":"Vision Transformer和Graph Transformer的主要区别是什么？","back":"ViT处理规则网格（图像patch），位置编码固定；Graph Transformer处理任意图结构，位置编码需要考虑图拓扑（如相对位置、拉普拉斯特征向量等）。","chapterId":"03-transformer","tags":["Transfor"]},{"id":"fc-18","front":"Transolver的核心创新是什么？","back":"提出Physics-Attention：先将网格点分配到\"物理状态切片\"（slice），在切片级别计算注意力而非逐点计算，降低复杂度同时提升物理可解释性。","chapterId":"03-transformer","tags":["Transfor"]},{"id":"fc-19","front":"什么是物理信息神经网络（PINN）？","back":"将物理定律（通常是PDE）作为软约束加入损失函数的神经网络，通过自动微分计算方程残差，使网络输出满足物理规律。","chapterId":"04-physics-pinn","tags":["物理约束与 PI"]},{"id":"fc-20","front":"PINN的损失函数通常包含哪几部分？","back":"1) 数据损失：与观测/仿真数据的偏差；2) PDE残差损失：控制方程的残差；3) 边界条件损失：边界上的约束；4) 初始条件损失：初始时刻的约束。","chapterId":"04-physics-pinn","tags":["物理约束与 PI"]},{"id":"fc-21","front":"PhyGNNet是什么？","back":"Physics-informed Graph Neural Network的缩写，将PINN的物理约束思想与GNN结合，在不规则域上求解PDE的方法。","chapterId":"04-physics-pinn","tags":["物理约束与 PI"]},{"id":"fc-22","front":"物理约束有什么好处？","back":"1) 提升数据效率（减少对标注数据的依赖）；2) 保证物理一致性（不会出现违背守恒律的结果）；3) 提升外推能力（在分布外仍能给出合理预测）；4) 提升泛化性能。","chapterId":"04-physics-pinn","tags":["物理约束与 PI"]},{"id":"fc-23","front":"DeepMind的GNS是什么？","back":"Graph Network-based Simulators，基于图网络的仿真框架，用粒子作为节点，通过学习消息传递来模拟复杂物理系统（流体、刚体、可变形材料等）。","chapterId":"05-hybrid-frontend","tags":["混合架构与前沿方"]},{"id":"fc-24","front":"MeshGraphNet的特点是什么？","back":"使用网格（mesh）本身作为图结构，支持自适应网格细化，能处理空气动力学、结构力学、布料等多种物理系统，速度比训练用的仿真器快1-2个数量级。","chapterId":"05-hybrid-frontend","tags":["混合架构与前沿方"]},{"id":"fc-25","front":"碰撞仿真中接触建模的挑战是什么？","back":"接触是高度非线性、不连续的现象；需要精确检测碰撞对；接触力的建模影响仿真稳定性；动态变化的接触对需要动态图构建。","chapterId":"05-hybrid-frontend","tags":["混合架构与前沿方"]},{"id":"fc-26","front":"GNN+Transformer混合架构的优势是什么？","back":"GNN擅长处理局部交互（有强归纳偏置），Transformer擅长捕捉长程依赖，两者结合可以同时建模局部和全局的物理相互作用。","chapterId":"05-hybrid-frontend","tags":["混合架构与前沿方"]},{"id":"fc-27","front":"PyTorch Geometric (PyG) 是什么？","back":"基于PyTorch的图神经网络库，提供GCN、GAT、GraphSAGE等数十种GNN层，支持数据加载、批量处理、分布式训练等完整功能。","chapterId":"06-tools-datasets","tags":["工具框架与数据集"]},{"id":"fc-28","front":"DGL是什么？","back":"Deep Graph Library，另一个流行的GNN框架，由亚马逊/纽约大学开发，支持PyTorch、TensorFlow、MXNet等后端。","chapterId":"06-tools-datasets","tags":["工具框架与数据集"]},{"id":"fc-29","front":"ΦFlow是什么？","back":"一个可微仿真工具包，支持PyTorch、TensorFlow、JAX和NumPy，提供微分算子、边界条件、可微求解器等，用于物理仿真的可微编程。","chapterId":"06-tools-datasets","tags":["工具框架与数据集"]},{"id":"fc-30","front":"DeepMind Control Suite是什么？","back":"一套基于MuJoCo的连续控制基准任务集合，包含多种机器人控制环境，常用于强化学习和模型学习研究。","chapterId":"06-tools-datasets","tags":["工具框架与数据集"]},{"id":"fc-31","front":"弹簧-质点系统的基本物理方程是什么？","back":"遵循牛顿第二定律F=ma和胡克定律F=-kΔx，其中k是弹簧刚度，Δx是形变量。","chapterId":"07-spring-mass","tags":["实战：弹簧-质点"]},{"id":"fc-32","front":"在GNN仿真中，节点和边通常分别代表什么？","back":"节点代表质点（存储位置、速度、质量等特征），边代表弹簧（存储刚度、原长、相对位移等特征）。","chapterId":"07-spring-mass","tags":["实战：弹簧-质点"]},{"id":"fc-33","front":"如何验证GNN仿真模型的正确性？","back":"1) 与解析解或数值参考解对比轨迹误差；2) 检查能量守恒等物理量是否守恒；3) 在不同初始条件和参数下测试泛化能力；4) 长时推演的稳定性测试。","chapterId":"07-spring-mass","tags":["实战：弹簧-质点"]},{"id":"fc-34","front":"训练GNN仿真模型时，噪声注入（noise corruption）的作用是什么？","back":"在训练输入中加入随机噪声，模拟推理时的误差累积，提高模型在长时自回归推演中的稳定性和鲁棒性。","chapterId":"07-spring-mass","tags":["实战：弹簧-质点"]},{"id":"fc-35","front":"物理仿真GNN常用的评估指标有哪些？","back":"1) 一步预测误差（MSE）；2) 长时推演误差（rollout error）；3) 物理量守恒误差（能量、动量等）；4) 结构相似度（SSIM）或关键帧精度。","chapterId":"07-spring-mass","tags":["实战：弹簧-质点"]}]}, {"01-crash-basics":{"title":"碰撞仿真与降阶基础","passingScore":70,"maxAttempts":3,"questions":[{"id":"crashbasics-1","type":"single","difficulty":"easy","stem":"碰撞仿真降阶模型（ROM）的核心思想是？","explanation":"ROM = 潜空间演化 + 重构,精度/速度的工程权衡","tags":["01-crash-basics"],"options":["降低物理精度以换取速度","将高维物理系统映射到低维潜空间演化再映射回去","用 AI 完全替代 FEM","减少网格密度"],"answer":1},{"id":"crashbasics-2","type":"single","difficulty":"easy","stem":"GNN 替代模型相比 FEM 的典型推理加速量级？","explanation":"GNN 推理复杂度与图规模线性,FEM 需迭代求解高维方程","tags":["01-crash-basics"],"options":["2-5 倍","10-50 倍","100-1000 倍","无法加速"],"answer":2},{"id":"crashbasics-3","type":"tf","difficulty":"easy","stem":"CNN 天然适合处理碰撞仿真的不规则有限元网格。","explanation":"CNN 依赖规则网格,不规则网格需 GNN","tags":["01-crash-basics"],"options":["对","错"],"answer":0},{"id":"crashbasics-4","type":"single","difficulty":"medium","stem":"GNN 适合处理不规则网格的核心优势不包括？","explanation":"GNN 输入尺寸灵活,与排列无关","tags":["01-crash-basics"],"options":["排列不变性","局部归纳偏置","权重共享","依赖固定输入尺寸"],"answer":3},{"id":"crashbasics-5","type":"multi","difficulty":"medium","stem":"AI 降阶模型与 FEM 是何种关系？","explanation":"互补:FEM 精度高 + AI 推理快,各取所长","tags":["01-crash-basics"],"options":["完全替代关系","互补关系","FEM 提供训练数据","GNN 提供快速推理","完全无关联"],"answer":[1,2,3]},{"id":"crashbasics-6","type":"single","difficulty":"hard","stem":"降阶方法（ROM）按线性/非线性分类，下列哪项属于非线性降阶？","explanation":"Autoencoder + 神经 ODE 捕捉非线性动力学","tags":["01-crash-basics"],"options":["POD","Krylov 子空间","Autoencoder + 神经 ODE","模态叠加"],"answer":2},{"id":"crashbasics-7","type":"short","difficulty":"easy","stem":"碰撞仿真中常用的降阶目标是在保证精度的前提下降低 _______ 成本。","explanation":"计算","tags":["01-crash-basics"],"answer":""},{"id":"crashbasics-8","type":"short","difficulty":"medium","stem":"请简述为什么传统有限元（FEM）在汽车碰撞大变形仿真中计算昂贵。","explanation":"高维非线性方程 + 显式时间积分步数多 + 接触碰撞强非线性","tags":["01-crash-basics"],"answer":""}]},"02-gnn-core":{"title":"图神经网络（GNN）核心","passingScore":70,"maxAttempts":3,"questions":[{"id":"gnncore-1","type":"single","difficulty":"easy","stem":"MPNN（消息传递神经网络）的两个核心步骤是？","explanation":"MPNN = 消息构造 + 邻居聚合 + 节点更新","tags":["02-gnn-core"],"options":["编码-解码","消息构造 + 聚合更新","卷积-池化","采样-聚合"],"answer":1},{"id":"gnncore-2","type":"tf","difficulty":"easy","stem":"GNN 层数过多会导致\"过度平滑\"问题,所有节点特征趋同。","explanation":"深层 GNN 信息混合,失去区分度","tags":["02-gnn-core"],"options":["对","错"],"answe :["编码物理特征","消息传递更新","将潜特征映射回物理输出","计算损失"],"answer":2},{"id":"final-8","type":"single","difficulty":"medium","stem":"为什么 Graph Transformer 需用 Laplacian 特征向量做位置编码？","explanation":"Laplacian 特征向量编码图结构","tags":["final"],"options":["随机生成","捕捉图全局拓扑结构","与图像相同","替代注意力"],"answer":1},{"id":"final-9","type":"multi","difficulty":"medium","stem":"哪些是物理仿真 GNN 的关键设计选择？","explanation":"第四项是训练技巧,非设计选择","tags":["final"],"options":["预测状态变化量而非下一状态","局部消息传递层数","物理损失加权","固定 batch size"],"answer":[0,1,2]},{"id":"final-10","type":"short","difficulty":"medium","stem":"PINN 损失函数通常由数据损失 + PDE 残差 + _______ 条件损失组成。","explanation":"边界 / 初始","tags":["final"],"answer":""},{"id":"final-11","type":"short","difficulty":"hard","stem":"请设计一个 GNN + Transformer 混合架构用于汽车前碰仿真,说明输入输出与训练策略。","explanation":"输入:车辆几何图(节点=梁/A柱单元,边=连接) + 边界速度场;Encoder:GNN 编码局部结构 + Transformer 全局碰撞波传播;Processor:GNN+Transformer 交替 N 层;输出:节点位移/加速度/应力增量;训练:数据 FEM 仿真 + 物理损失(动量/能量守恒) + rollout teacher forcing","tags":["final"],"answer":""},{"id":"final-12","type":"single","difficulty":"medium","stem":"可微物理仿真（JAX/ΦFlow）的核心价值是？","explanation":"可微仿真 = 端到端优化","tags":["final"],"options":["更快推理","端到端优化控制策略 / 反问题 + 物理约束","替代 GNN","减少显存"],"answer":1},{"id":"final-13","type":"short","difficulty":"hard","stem":"请论述 AI 降阶模型在 5 星 C-NCAP 评价场景中的可解释性要求与实现思路。","explanation":"可解释性 = 物理一致性 + 局部归因;实现:1) 物理损失约束 2) 注意力可视化(Transformer) 3) 残差场可解释输出 4) 不确定度估计","tags":["final"],"answer":""}]}});
  document.getElementById('topnav').innerHTML = CourseApp.renderTopnav('gn-crash', 'GNN碰撞仿真降阶', 'quizzes');
  const quiz = CourseQuiz.loadQuiz('04-physics-pinn');
  if (!quiz) { document.getElementById('quizContainer').innerHTML = '<div class="card">找不到测验数据</div>'; return; }
  CourseQuiz.start('04-physics-pinn');
  renderQuiz();

  function renderQuiz() {
    const st = CourseQuiz.getCurrent();
    if (!st) return;
    const q = st.questions[st.currentIdx];
    const fb = st.feedback[q.id];
    const html = `
      <div class="quiz-card">
        <div class="quiz-progress">
          <span>📝 ${st.mode === 'final' ? '期末考试' : '第 physics-pinn 章测验'} · 第 ${st.currentIdx + 1} / ${st.questions.length} 题</span>
          <span>⏱ ${Math.round(st.seconds / 60)} 分钟</span>
        </div>
        <div class="quiz-stem">${q.stem}</div>
        ${renderOptions(q, fb, st.answers[q.id])}
        ${fb ? renderFeedback(q, fb) : ''}
        <div class="btn-row" style="margin-top: 24px;">
          <button class="btn" id="prevBtn" ${st.currentIdx === 0 ? 'disabled' : ''}>← 上一题</button>
          <button class="btn" id="nextBtn" ${st.currentIdx === st.questions.length - 1 ? 'disabled' : ''}>下一题 →</button>
          <button class="btn btn-primary" id="submitBtn" style="margin-left:auto;">交卷</button>
        </div>
      </div>`;
    document.getElementById('quizContainer').innerHTML = html;
    bindQuizEvents();
  }

  function renderOptions(q, fb, saved) {
    if (q.type === 'fill' || q.type === 'short') {
      return `<textarea class="note-area" id="answerArea" placeholder="输入你的答案">${saved || ''}</textarea>
              <button class="btn btn-primary" id="answerBtn" style="margin-top: 8px;">提交答案</button>`;
    }
    // 多选:checkbox + 确认按钮(只有按"确认选择"才判分)
    if (q.type === 'multi') {
      const checked = Array.isArray(saved) ? new Set(saved.map(Number)) : new Set();
      const opts = q.options || [];
      const htmls = opts.map((o, i) => {
        const isChecked = checked.has(i);
        let cls = isChecked ? 'selected' : '';
        if (isChecked && fb) cls += fb.correct ? ' correct' : ' wrong';
        return `<label class="quiz-opt-multi ${cls}" data-idx="${i}">
          <input type="checkbox" class="quiz-multi-cb" data-idx="${i}" ${isChecked ? 'checked' : ''}>
          <span class="quiz-multi-letter">${String.fromCharCode(65 + i)}.</span>
          <span class="quiz-multi-text">${o}</span>
        </label>`;
      }).join('');
      const fbClass = fb ? (fb.correct ? 'correct' : 'wrong') : '';
      const confirmBtn = fb ? '' : `<button class="btn btn-primary" id="multiConfirmBtn" style="margin-top:12px;">确认选择</button>`;
      const hint = !fb ? `<div class="text-dim text-sm" style="margin-top:6px;">📌 多选题:选中所有你认为正确的选项后,点击"确认选择"</div>` : '';
      return `<div class="quiz-options quiz-options-multi" data-qid="${q.id}">${htmls}</div>${hint}${confirmBtn}`;
    }
    // 单选/判断:点击即判分
    const opts = q.options || ['对','错'];
    return `<div class="quiz-options">${
      opts.map((o, i) => {
        const selected = saved !== undefined && Number(saved) === i;
        const cls = selected ? (fb ? (fb.correct ? 'correct' : 'wrong') : 'selected') : '';
        return `<button class="quiz-opt ${cls}" data-idx="${i}">${String.fromCharCode(65 + i)}. ${o}</button>`;
      }).join('')
    }</div>`;
  }

  function renderFeedback(q, fb) {
    const cls = fb.correct ? 'correct' : 'wrong';
    return `<div class="quiz-feedback ${cls}">
      <div class="quiz-feedback-title">${fb.correct ? '✓ 正确!' : '✗ 答错了'}</div>
      ${!fb.correct && q.answer !== undefined ? `<div>正确答案:${Array.isArray(q.answer) ? q.answer.map(i => String.fromCharCode(65+i)).join(', ') : (q.options ? String.fromCharCode(65 + q.answer) + ' - ' + q.options[q.answer] : q.answer)}</div>` : ''}
      ${q.explanation ? `<div style="margin-top:6px;">💡 ${q.explanation}</div>` : ''}
    </div>`;
  }

  function bindQuizEvents() {
    const st = CourseQuiz.getCurrent();
    const q = st.questions[st.currentIdx];
    // 单选/判断:点击立即判分
    document.querySelectorAll('.quiz-opt').forEach(btn => btn.addEventListener('click', e => {
      const idx = parseInt(e.currentTarget.dataset.idx);
      CourseQuiz.answer(q.id, idx);
      renderQuiz();
    }));
    // 多选:点击 label 切换 checkbox,不立即判分
    document.querySelectorAll('.quiz-multi-cb').forEach(cb => cb.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx);
      const label = e.target.closest('.quiz-opt-multi');
      if (label) label.classList.toggle('selected', e.target.checked);
    }));
    // 多选"确认选择"
    const mc = document.getElementById('multiConfirmBtn');
    if (mc) mc.addEventListener('click', () => {
      const selected = Array.from(document.querySelectorAll('.quiz-multi-cb:checked')).map(cb => Number(cb.dataset.idx));
      if (selected.length === 0) { alert('请至少选择一个选项'); return; }
      CourseQuiz.answer(q.id, selected);
      renderQuiz();
    });
    const ansBtn = document.getElementById('answerBtn');
    if (ansBtn) ansBtn.addEventListener('click', () => {
      const v = document.getElementById('answerArea').value;
      CourseQuiz.answer(q.id, v);
      renderQuiz();
    });
    document.getElementById('prevBtn')?.addEventListener('click', () => { CourseQuiz.prev(); renderQuiz(); });
    document.getElementById('nextBtn')?.addEventListener('click', () => { CourseQuiz.next(); renderQuiz(); });
    document.getElementById('submitBtn').addEventListener('click', submitQuiz);
  }

  function submitQuiz() {
    const st = CourseQuiz.getCurrent();
    const unanswered = st.questions.filter(q => st.feedback[q.id] === undefined);
    if (unanswered.length > 0) {
      if (!confirm(`还有 ${unanswered.length} 题未答,确认交卷?`)) return;
    }
    const result = CourseQuiz.submit();
    CourseQuiz.getMistakes().forEach(m => CourseMistakes.add(st.chapterId, m.question, m.feedback.userAnswer));
    renderResult(result);
  }

  function renderResult(r) {
    const cls = r.passed ? 'pass' : 'fail';
    const msg = r.passed ? '🎉 通过!' : '未通过,再接再厉';
    const st = CourseQuiz.getCurrent();
    let html = `<div class="quiz-result">
      <h2>${msg}</h2>
      <div class="quiz-score ${cls}">${r.score}/100</div>
      <p style="color:var(--text-dim);">通过标准: ${r.passingScore} 分 · 用时 ${Math.round(r.seconds/60)} 分钟</p>
    `;
    const mistakes = CourseQuiz.getMistakes();
    if (mistakes.length > 0) {
      html += '<h3 style="margin-top:24px;">📋 错题列表</h3>';
      mistakes.forEach(m => {
        html += `<div class="mistakes-card">
          <div style="font-weight: 600;">${m.question.stem}</div>
          <div style="color: var(--text-dim); margin-top: 6px; font-size: 14px;">正确答案:${m.feedback.correctAnswer}</div>
          <div style="margin-top: 6px; font-size: 14px;">💡 ${m.question.explanation || ''}</div>
        </div>`;
      });
    }
    html += `<div class="btn-row" style="margin-top: 24px;">
      <a class="btn" href="quizzes.html">← 返回测验列表</a>
      <a class="btn btn-primary" href="mistakes.html">查看错题本 →</a>
    </div></div>`;
    document.getElementById('quizContainer').innerHTML = html;
    if (r.passed && st.chapterId !== 'final') {
      CourseProgress.setChapterStatus(st.chapterId, 'completed');
    }
  }
})();
