ficulty":"medium","q":"PINN 与传统 POD-ROM 相比的三大本质优势?","a":"1) 无网格特性;2) 物理一致性保证;3) 逆问题天然支持"},{"id":"f1-5","chapter":1,"difficulty":"medium","q":"AI 降阶模型在训练参数空间内插值的精度范围?","a":"零部件级 RMSE 3-5%;整车级 RMSE < 3%(基于 5000+ 训练样本)"},{"id":"f1-6","chapter":1,"difficulty":"medium","q":"PINN 的频谱偏见(spectral bias)指什么?","a":"神经网络倾向于学习低频成分,难以捕捉高阶振荡和微观尺度剧烈变化"},{"id":"f1-7","chapter":1,"difficulty":"medium","q":"为什么碰撞场景不适合直接加 PDE 残差?","a":"碰撞含强非线性 + 接触不连续,无法用显式 PDE 残差约束;工业实践用数据驱动为主、物理约束为辅的混合架构"},{"id":"f2-1","chapter":2,"difficulty":"easy","q":"Luminary SHIFT-Crash 整车级代理模型 RMSE?","a":"小于 3%(基于 5000 次 2010 Toyota Yaris 碰撞仿真)"},{"id":"f2-2","chapter":2,"difficulty":"easy","q":"SHIFT-Crash 第三个 SUV 项目需要多少额外仿真?","a":"少于 300 次(迁移学习效果)"},{"id":"f2-3","chapter":2,"difficulty":"medium","q":"SEAT/IDIADA 侧柱撞击代理模型的时间平均 RMSE?","a":"3.20 mm(25 测试样本)"},{"id":"f2-4","chapter":2,"difficulty":"medium","q":"代理模型架构三代演进路径?","a":"第一代标量回归(GPR/DNN) → 第二代全场 GNN(MeshGraphNet) → 第三代注意力混合(Transolver)"},{"id":"f2-5","chapter":2,"difficulty":"medium","q":"MeshGraphNet 的核心机制?","a":"边更新-节点更新的消息传递,以网格连接为图结构,具有结构归纳偏置"},{"id":"f2-6","chapter":2,"difficulty":"hard","q":"FNO 在强非线性结构动力学中的局限?","a":"非线性系统误差可达 0.38(立方硬化)甚至失效(双线性滞回);超出训练区间误差 > 1,完全失效"},{"id":"f2-7","chapter":2,"difficulty":"hard","q":"Transolver 相对前 SOTA 在标准基准的误差降低?","a":"降低 22%"},{"id":"f3-1","chapter":3,"difficulty":"easy","q":"传统多尺度方法 FE² 的计算瓶颈?","a":"每个宏观积分点都需调用一次微观 RVE 完整有限元,计算量与两个尺度自由度乘积成正比"},{"id":"f3-2","chapter":3,"difficulty":"medium","q":"HOMS-PINN 的核心思想?","a":"通过多尺度渐近分析将强振荡的微观场提取出来,PINN 只需学习相对光滑的宏观场和修正项"},{"id":"f3-3","chapter":3,"difficulty":"medium","q":"PRNN 的核心创新?","a":"将本构关系的路径依赖性编码进循环结构,准确捕捉非线性滞回行为"},{"id":"f3-4","chapter":3,"difficulty":"medium","q":"VPINN 采用什么方法?","a":"Petrov-Galerkin 方法,以神经网络为试函数、局部多项式为检验函数"},{"id":"f3-5","chapter":3,"difficulty":"hard","q":"材料多尺度 vs 结构多尺度 AI 降阶的合理分工?","a":"微观/介观用 PINN(物理约束强、样本小);宏观/系统级用 GNN/神经算子(数据驱动、规模大)"},{"id":"f3-6","chapter":3,"difficulty":"hard","q":"HOMS-PIRNN 与 HOMS-RNN 的改进点?","a":"随机神经网络版本 + 循环结构,提升动态热力耦合问题的效率和精度"},{"id":"f4-1","chapter":4,"difficulty":"easy","q":"DeepXDE 的核心开发者?","a":"布朗大学/北京大学 Lu Lu 团队"},{"id":"f4-2","chapter":4,"difficulty":"easy","q":"NVIDIA PhysicsNeMo 支持的官方碰撞示例架构?","a":"MeshGraphNet、Transolver、GeoTransolver、GeoFlare 多种,精度 GeoFlare > GeoTransolver > Transolver > MeshGraphNet"},{"id":"f4-3","chapter":4,"difficulty":"medium","q":"Ansys SimAI 的核心架构?","a":"基于隐式神经表示(INR)的连续代理模型,对网格变化鲁棒,能捕捉多尺度现象"},{"id":"f4-4","chapter":4,"difficulty":"medium","q":"DEP AIWorks 的核心?","a":"Physics-Informed Neural Network(PINN)技术,针对轻度/中度/高度非线性有独立架构"},{"id":"f4-5","chapter":4,"difficulty":"medium","q":"Altair PhysicsAI 与 BMW 合作的核心创新?","a":"将聚类+分类引入优化,以模拟工程经验判断"},{"id":"f4-6","chapter":4,"difficulty":"hard","q":"汽车碰撞 AI 工具的当前成熟度排名?","a":"Luminary SHIFT-Crash(整车级)< Ansys SimAI(子系统)< Altair(优化)< DEP(PINN 通用)< 学术验证"},{"id":"f5-1","chapter":5,"difficulty":"easy","q":"AI 代理模型的最关键风险?","a":"泛化性和可信度,缺乏针对 AI 仿真结果的验证标准和监管认可路径"},{"id":"f5-2","chapter":5,"difficulty":"medium","q":"AI 降阶模型的工程定位?","a":"早期设计筛选工具,而非最终验证工具;价值在于将设计空间探索能力从几十个提升到上万个方案"},{"id":"f5-3","chapter":5,"difficulty":"medium","q":"GNN+Transformer+物理约束落地 4 阶段?","a":"验证可行性(2-4周) → 完整链路(4-6周) → 工程化优化(4-8周) → 多尺度拓展"},{"id":"f5-4","chapter":5,"difficulty":"medium","q":"DOE 参数维度爆炸的经验法则?","a":"参数维度为 d 时,初始 DOE 需要 10d~20d 个样本点"},{"id":"f5-5","chapter":5,"difficulty":"hard","q":"数据获取成本 vs 物理约束建模成本的工程权衡?","a":"工业实践中高质量仿真数据获取成本低于从零构建物理约束模型的工程成本,因此'数据为主、物理为辅'是务实的混合架构选择"},{"id":"f6-1","chapter":6,"difficulty":"easy","q":"PINN 入门推荐的 2 个开源框架?","a":"DeepXDE(布朗/PKU Lu Lu 团队)、NVIDIA PhysicsNeMo"},{"id":"f6-2","chapter":6,"difficulty":"easy","q":"GNN 入门推荐的入门论文?","a":"DeepMind 2020 GNS(Learning Mesh-Based Simulation with Graph Networks)"},{"id":"f6-3","chapter":6,"difficulty":"medium","q":"学习路径的 4 阶段?","a":"基础夯实(Python+PyG+有限元) → 模型实现(GNN+Transformer) → 物理约束加入 → 商业方案调研"},{"id":"f6-4","chapter":6,"difficulty":"medium","q":"整车级 AI 代理模型的硬件需求?","a":"A100/H100 80GB+,数周训练时间"},{"id":"f6-5","chapter":6,"difficulty":"hard","q":"准备落地的团队推荐的三段式路线?","a":"DOE 采样 + GNN/神经算子代理模型 + PINN 物理增强,从子结构/部件级切入,积累数据后扩展到系统级"}]}, {"01-tech-foundations":{"title":"第 1 章测验 · 技术原理","passingScore":70,"maxAttempts":3,"questions":[{"id":"q1-1","type":"single","difficulty":"easy","stem":"AI+DOE+PINN 仿真降阶的'三段式'是?","options":["数据采集 → 模型训练 → 部署","数据生成 → 物理约束建模 → 快速推理","模型设计 → 训练 → 验证","DOE采样 → 仿真 → 数据分析"],"answer":1,"explanation":"完整链路是:DOE 采样+高保真仿真生成数据 → PINN/GNN 代理建模 → 快速推理返回结果。","tags":["技术原理"]},{"id":"q1-2","type":"single","difficulty":"easy","stem":"PINN 损失函数的组成部分不包括?","options":["PDE 残差损失","边界条件损失","初始条件损失","数据归一化损失"],"answer":3,"explanation":"标准 PINN 损失由 PDE 残差 + 边界 + 初始 + 数据拟合 4 部分组成,数据归一化是预处理步骤不是损失项。","tags":["PINN"]},{"id":"q1-3","type":"tf","difficulty":"easy","stem":"拉丁超立方采样(LHS)是最常用的 DOE 采样方法之一。","options":["对","错"],"answer":0,"explanation":"LHS 入门级首选,确保每个变量维度均匀覆盖。","tags":["DOE"]},{"id":"q1-4","type":"single","difficulty":"medium","stem":"PINN 相对 POD-ROM 的最大劣势?","options":["无网格特性","物理一致性","训练效率低","逆问题支持"],"answer":2,"explanation":"PINN 训练速度通常显著慢于经典数值方法,因为需优化大量参数且损失函数含高阶导数计算。","tags":["PINN"]},{"id":"q1-5","type":"multi","difficulty":"medium","stem":"PINN 的本质优势包含哪些? (多选)","options":["无网格特性","物理一致性保证","线性子空间逼近","逆问题天然支持"],"answer":[0,1,3],"explanation":"PINN 三大本质优势:无网格、物理一致性、逆问题支持。线性子空间逼近是 POD-ROM 的特点。","tags":["PINN"]},{"id":"q1-6","type":"fill","difficulty":"medium","stem":"DOE 参数维度为 d 时,初始样本量的经验法则是 ____ 个样本点。","options":null,"answer":"10d~20d","explanation":"经验法则:参数维度为 d 时,初始 DOE 需要 10d~20d 个样本点。","tags":["DOE"]},{"id":"q1-7","type":"single","difficulty":"medium","stem":"神经网络倾向于学习什么频率成分?","options":["高频","低频","均匀","随机"],"answer":1,"explanation":"这是神经网络的频谱偏见(spectral bias),倾向低频,捕捉高阶振荡需多尺度方法。","tags":["PINN"]},{"id":"q1-8","type":"tf","difficulty":"medium","stem":"碰撞动力学的强非线性使纯 PDE 残差约束很难实际应用。","options":["对","错"],"answer":0,"explanation":"碰撞含塑性+接触+大变形等不连续,PDE 残差约束效果差,工业实践采用数据为主、物理约束为辅的混合架构。","tags":["碰撞"]},{"id":"q1-9","type":"single","difficulty":"hard","stem":"自适应采样(RAR-G/RAD)在 DOE 中的作用?","options":["均匀覆盖","训练过程中动态向残差大的区域补充样本","减少样本总数","固定采样网格"],"answer":1,"explanation":"自适应采样在训练过程中动态补充残差大的样本,是提升数据效率的关键。","tags":["DOE","高级"]},{"id":"q1-10","type":"short","difficulty":"hard","stem":"请简述为什么'数据为主、物理约束为辅'是当前工业级碰撞降阶的务实选择。","options":null,"answer":"因为工业实践中高质量仿真数据获取成本低于从零构建物理约束模型的工程成本,而碰撞的强非线性+接触不连续使纯 PDE 残差约束效果差。混合架构以 GNN/Transformer 学习时空动力学为主,加入能量/动量等全局物理约束作为正则化。","explanation":"开放题,需自评对照。","tags":["综合"]}]},"02-research-progress":{"title":"第 2 章测验 · 学术前沿","passingScore":70,"maxAttempts":3,"questions":[{"id":"q2-1","type":"single","difficulty":"easy","stem":"Luminary SHIFT-Crash 整车级代理模型的 RMSE?","options":["< 1%","< 3%","< 5%","< 10%"],"answer":1,"explanation":"基于 5000 次 2010 Toyota Yaris 碰撞仿真训练,RMSE < 3%。","tags":["Luminary"]},{"id":"q2-2","type":"single","difficulty":"medium","stem":"SHIFT-Crash 第三个 SUV 项目需要额外多少仿真?","options":["300 以下","500","1000","5000"],"answer":0,"explanation":"迁移学习让第三个 SUV 项目只需 < 300 次额外仿真(从首个 SUV 的 5000 次递减)。","tags":["Luminary","迁移学习"]},{"id":"q2-3","type":"single","difficulty":"medium","stem":"SEAT/IDIADA 侧柱撞击代理模型的时间平均 RMSE?","options":["1.20 mm","3.20 mm","5.20 mm","10.20 mm"],"answer":1,"explanation":"25 测试样本上时间平均 RMSE 3.20 mm,采用 MeshTransolver 等混合架构。","tags":["SEAT"]},{"id":"q2-4","type":"single","difficulty":"medium","stem":"代理模型架构第三代采用?","options":["纯 GNN","纯 Transformer","GNN + Transformer 注意力混合","纯 FNO"],"answer":2,"explanation":"第三代是注意力混合(Transolver/GeoTransolver),在 GNN 基础上引入注意力捕捉长程变形。","tags":["架构"]},{"id":"q2-5","type":"tf","difficulty":"medium","stem":"MeshGraphNet 以网格连接为图结构,通过消息传递机制学习局部物理交互。","options":["对","错"],"answer":0,"explanation":"MeshGraphNet 是第二代代表,以边更新-节点更新消息传递机制为核心。","tags":["MeshGraphNet"]},{"id":"q2-6","type":"single","difficulty":"hard","stem":"FNO 在双线性滞回非线性系统中的相对 L2 误差?","options":["0.02","0.10","0.38","> 1"],"answer":2,"explanation":"UC Berkeley 系统评估:FNO 在双线性滞回系统误差 0.38,在地震激励下非线性系统误差随非线性程度急剧恶化。","tags":["FNO","局限"]},{"id":"q2-7","type":"single","difficulty":"hard","stem":"Transolver 相对前 SOTA 在标准基准的误差降低?","options":["5%","15%","22%","40%"],"answer":2,"explanation":"Transolver 在六个标准基准上比之前 SOTA 降低 22% 误差,ICML 2024 Spotlight。","tags":["Transolver"]},{"id":"q2-8","type":"multi","difficulty":"hard","stem":"碰撞代理模型架构选择需要平衡哪些? (多选)","options":["标量精度","生存空间一致性","物理解释性","训练数据量"],"answer":[0,1,2],"explanation":"研究表明'网格消息传递+几何感知注意力+稀疏接触感知修正'在标量精度、生存空间一致性和物理解释性之间取得最佳平衡。","tags":["架构","综合"]},{"id":"q2-9","type":"single","difficulty":"medium","stem":"NVIDIA + 通用汽车白车身碰撞研究使用的样本数?","options":["15","150","1500","5000"],"answer":1,"explanation":"使用 150 次 LS-DYNA 仿真训练 MeshGraphNet 和 Transolver,支持可变厚度分布参数化输入。","tags":["NVIDIA"]},{"id":"q2-10","type":"short","difficulty":"hard","stem":"请简述为什么'纯注意力模型'虽然量化指标好但定性检查仍发现空间噪声问题。","options":null,"answer":"纯 Transformer 缺乏 GNN 的结构归纳偏置和局部平滑约束,在局部区域可能出现变形不规则、生存空间不连续等问题,需要 GNN+几何感知注意力+接触感知修正等混合架构弥补。","explanation":"开放题。","tags":["综合"]}]},"03-multiscale":{"title":"第 3 章测验 · 多尺度仿真","passingScore":70,"maxAttempts":3,"questions":[{"id":"q3-1","type":"single","difficulty":"easy","stem":"传统多尺度方法 FE² 的计算瓶颈?","options":["内存不足","每宏观积分点需调用一次微观 RVE","网格划分困难","并行效率低"],"answer":1,"explanation":"FE² 每个宏观积分点都需调用微观 RVE 完整有限元,工程问题中几乎不可行。","tags":["多尺度"]},{"id":"q3-2","type":"single","difficulty":"medium","stem":"HOMS-PINN 的核心思想?","options":["全连接替代 FEM","多尺度渐近分析分解微宏观","直接 PDE 约束","自动微分"],"answer":1,"explanation":"HOMS-PINN 通过多尺度渐近分析把强振荡的微观场提取出来,PINN 只需学相对光滑的宏观场+修正项。","tags":["HOMS-PINN"]},{"id":"q3-3","type":"tf","difficulty":"medium","stem":"PRNN 通过循环结构编码本构关系的路径依赖性。","options":["对","错"],"answer":0,"explanation":"PRNN 的核心是将本构路径依赖性编码进循环结构,准确捕捉非线性滞回行为。","tags":["PRNN"]},{"id":"q3-4","type":"single","difficulty":"medium","stem":"VPINN 采用什么方法?","options":["强形式 PINN","Petrov-Galerkin","变分方法","傅里叶方法"],"answer":1,"explanation":"VPINN 采用 Petrov-Galerkin 方法,以神经网络为试函数、局部多项式为检验函数。","tags":["VPINN"]},{"id":"q3-5","type":"fill","difficulty":"medium","stem":"HOMS-PINN 相对直接 PINN 模拟多尺度问题,计算量可减少约 ____ 。","options":null,"answer":"一半","explanation":"HOMS-PINN 计算量可减少约一半,同时能精确捕捉微观尺度剧烈振荡。","tags":["HOMS-PINN"]},{"id":"q3-6","type":"single","difficulty":"hard","stem":"微-介-宏观 AI 降阶的合理分工?","options":["全用 PINN","全用 GNN","微介观 PINN + 宏观 GNN","随机组合"],"answer":2,"explanation":"微介观用 PINN(物理约束强、样本小),宏观/系统级用 GNN/神经算子(数据驱动、规模大)。","tags":["综合"]},{"id":"q3-7","type":"multi","difficulty":"hard","stem":"结构多尺度 AI 降阶更依赖传统代理建模而非 PINN 的原因? (多选)","options":["材料多尺度 PDE 约束更明确","结构碰撞 PDE 含接触不连续使残差难算","整车几何复杂、载荷工况多样","PINN 训练时间太短"],"answer":[0,1,2],"explanation":"材料多尺度 PDE 约束直接有效;结构碰撞接触/失效使残差计算困难;整车几何载荷复杂,需 GNN 直接处理非结构化数据。","tags":["综合"]},{"id":"q3-8","type":"single","difficulty":"medium","stem":"PRNN 相对平均场均质化(MFH)的优势?","options":["计算更快","预测滞回行为更准","网格要求低","无需训练数据"],"answer":1,"explanation":"PRNN 预测的纱线非线性滞回行为与 FE 结果高度吻合,MFH 方法偏差较大。","tags":["PRNN"]},{"id":"q3-9","type":"tf","difficulty":"easy","stem":"AI 降阶在多尺度中常被用于替代微观 RVE 计算。","options":["对","错"],"answer":0,"explanation":"用神经网络代理替代微观 RVE 有限元,使每宏观积分点应力更新从'求解边界值问题'变为'神经网络前向传播',实现数量级加速。","tags":["多尺度"]},{"id":"q3-10","type":"short","difficulty":"hard","stem":"请说明 HOMS-PIRNN 和 HOMS-RNN 的应用场景及相对 HOMS-PINN 的改进点。","options":null,"answer":"HOMS-PIRNN 是随机神经网络版本,HOMS-RNN 是循环结构版本,主要解决动态热力耦合问题,提升效率和精度。","explanation":"开放题。","tags":["综合"]}]},"04-tools-frameworks":{"title":"第 4 章测验 · 工具框架","passingScore":70,"maxAttempts":3,"questions":[{"id":"q4-1","type":"single","difficulty":"easy","stem":"DeepXDE 的核心开发者?","options":["MIT","布朗大学/北京大学 Lu Lu","斯坦福","DeepMind"],"answer":1,"explanation":"DeepXDE 由布朗大学 Lu Lu 等人(现北京大学)开发,是 PINN 最广泛使用的开源框架。","tags":["DeepXDE"]},{"id":"q4-2","type":"single","difficulty":"easy","stem":"NVIDIA PhysicsNeMo 碰撞示例中精度最高的架构?","options":["MeshGraphNet","Transolver","GeoTransolver","GeoFlare"],"answer":3,"explanation":"精度排名:GeoFlare > GeoTransolver > Transolver > MeshGraphNet。","tags":["PhysicsNeMo"]},{"id":"q4-3","type":"single","difficulty":"medium","stem":"Ansys SimAI 的核心架构?","options":["基于 CNN","基于 GNN","基于隐式神经表示(INR)","基于 FNO"],"answer":2,"explanation":"Ansys SimAI 基于隐式神经表示(INR)的连续代理模型,对网格变化鲁棒,能捕捉多尺度现象。","tags":["Ansys SimAI"]},{"id":"q4-4"   function renderQuiz() {
    const st = CourseQuiz.getCurrent();

    const fb = st.feedback[q.id];
    const html = `
      <div class="quiz-card">
        <div class="quiz-progress">

          <span>⏱ ${Math.round(st.seconds / 60)} 分钟</span>
        </div>
        <div class="quiz-stem">${q.stem}</div>
        ${renderOptions(q, fb, st.answers[q.id])}
        ${fb ? renderFeedback(q, fb) : ''}
        <div class="btn-row" style="margin-top: 24px;">
          <button class="btn" id="prevBtn" ${st.currentIdx === 0 ? 'disabled' : ''}>← 上一题</button>
          <button class="btn" id="nextBtn" ${st.currentIdx === st.questions.length - 1 ? 'disabled' : ''}>下一题 →</button>
          <button class="btn btn-primary" id="submitBtn" style="margin-left:auto;">交卷</button>
        </div>
      </div>`;
    document.getElementById('quizContainer').innerHTML = html;
    bindQuizEvents();
  }

  function renderOptions(q, fb, saved) {
    if (q.type === 'fill' || q.type === 'short') {
      return `<textarea class="note-area" id="answerArea" placeholder="输入你的答案">${saved || ''}</textarea>
              <button class="btn btn-primary" id="answerBtn" style="margin-top: 8px;">提交答案</button>`;
    }
    // 多选:checkbox + 确认按钮(只有按"确认选择"才判分)
    if (q.type === 'multi') {
      const checked = Array.isArray(saved) ? new Set(saved.map(Number)) : new Set();
      const opts = q.options || [];
      const htmls = opts.map((o, i) => {
        const isChecked = checked.has(i);
        let cls = isChecked ? 'selected' : '';
        if (isChecked && fb) cls += fb.correct ? ' correct' : ' wrong';
        return `<label class="quiz-opt-multi ${cls}" data-idx="${i}">
          <input type="checkbox" class="quiz-multi-cb" data-idx="${i}" ${isChecked ? 'checked' : ''}>
          <span class="quiz-multi-letter">${String.fromCharCode(65 + i)}.</span>
          <span class="quiz-multi-text">${o}</span>
        </label>`;
      }).join('');
      const fbClass = fb ? (fb.correct ? 'correct' : 'wrong') : '';
      const confirmBtn = fb ? '' : `<button class="btn btn-primary" id="multiConfirmBtn" style="margin-top:12px;">确认选择</button>`;
      const hint = !fb ? `<div class="text-dim text-sm" style="margin-top:6px;">📌 多选题:选中所有你认为正确的选项后,点击"确认选择"</div>` : '';
      return `<div class="quiz-options quiz-options-multi" data-qid="${q.id}">${htmls}</div>${hint}${confirmBtn}`;
    }
    // 单选/判断:点击即判分
    const opts = q.options || ['对','错'];
    return `<div class="quiz-options">${
      opts.map((o, i) => {
        const selected = saved !== undefined && Number(saved) === i;
        const cls = selected ? (fb ? (fb.correct ? 'correct' : 'wrong') : 'selected') : '';
        return `<button class="quiz-opt ${cls}" data-idx="${i}">${String.fromCharCode(65 + i)}. ${o}</button>`;
      }).join('')
    }</div>`;
  }

  function renderFeedback(q, fb) {

      <div class="quiz-feedback-title">${fb.correct ? '✓ 正确!' : '✗ 答错了'}</div>
      ${!fb.correct && q.answer !== undefined ? `<div>正确答案:${Array.isArray(q.answer) ? q.answer.map(i => String.fromCharCode(65+i)).join(', ') : (q.options ? String.fromCharCode(65 + q.answer) + ' - ' + q.options[q.answer] : q.answer)}</div>` : ''}
      ${q.explanation ? `<div style="margin-top:6px;">💡 ${q.explanation}</div>` : ''}
    </div>`;
  }

    // 多选:点击 label 切换 checkbox,不立即判分
    document.querySelectorAll('.quiz-multi-cb').forEach(cb => cb.addEventListener('change', e => {
      const idx = parseInt(e.target.dataset.idx);
      const label = e.target.closest('.quiz-opt-multi');
      if (label) label.classList.toggle('selected', e.target.checked);
    }));
    // 多选"确认选择"
    const mc = document.getElementById('multiConfirmBtn');
    if (mc) mc.addEventListener('click', () => {
      const selected = Array.from(document.querySelectorAll('.quiz-multi-cb:checked')).map(cb => Number(cb.dataset.idx));
      if (selected.length === 0) { alert('请至少选择一个选项'); return; }
      CourseQuiz.answer(q.id, selected);
      renderQuiz();
    });
    const ansBtn = document.getElementById('answerBtn');
    if (ansBtn) ansBtn.addEventListener('click', () => {
      const v = document.getElementById('answerArea').value;
      CourseQuiz.answer(q.id, v);
      renderQuiz();
    });
    document.getElementById('prevBtn')?.addEventListener('click', () => { CourseQuiz.prev(); renderQuiz(); });
    document.getElementById('nextBtn')?.addEventListener('click', () => { CourseQuiz.next(); renderQuiz(); });
    document.getElementById('submitBtn').addEventListener('click', submitQuiz);
  }

  function submitQuiz() {
    const st = CourseQuiz.getCurrent();
    const unanswered = st.questions.filter(q => st.feedback[q.id] === undefined);
    if (unanswered.length > 0) {
      if (!confirm(`还有 ${unanswered.length} 题未答,确认交卷?`)) return;
    }
    const result = CourseQuiz.submit();
    CourseQuiz.getMistakes().forEach(m => CourseMistakes.add(st.chapterId, m.question, m.feedback.userAnswer));
    renderResult(result);
  }

  function renderResult(r) {
    const cls = r.passed ? 'pass' : 'fail';
    const msg = r.passed ? '🎉 通过!' : '未通过,再接再厉';
    const st = CourseQuiz.getCurrent();
    let html = `<div class="quiz-result">
      <h2>${msg}</h2>
      <div class="quiz-score ${cls}">${r.score}/100</div>
      <p style="color:var(--text-dim);">通过标准: ${r.passingScore} 分 · 用时 ${Math.round(r.seconds/60)} 分钟</p>
    `;
    const mistakes = CourseQuiz.getMistakes();
    if (mistakes.length > 0) {
      html += '<h3 style="margin-top:24px;">📋 错题列表</h3>';
      mistakes.forEach(m => {
        html += `<div class="mistakes-card">
          <div style="font-weight: 600;">${m.question.stem}</div>
          <div style="color: var(--text-dim); margin-top: 6px; font-size: 14px;">正确答案:${m.feedback.correctAnswer}</div>
          <div style="margin-top: 6px; font-size: 14px;">💡 ${m.question.explanation || ''}</div>
        </div>`;
      });
    }
    html += `<div class="btn-row" style="margin-top: 24px;">
      <a class="btn" href="quizzes.html">← 返回测验列表</a>
      <a class="btn btn-primary" href="mistakes.html">查看错题本 →</a>
    </div></div>`;
    document.getElementById('quizContainer').innerHTML = html;
    if (r.passed && st.chapterId !== 'final') {
      CourseProgress.setChapterStatus(st.chapterId, 'completed');
    }
  }
})();
