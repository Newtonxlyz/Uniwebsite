<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闪卡复习</title>
<link rel="stylesheet" href="../_shared/course-css.css">
</head>
<body>
<nav id="topnav"></nav>

<main class="container">
  <header class="lesson-header">
    <div class="lesson-breadcrumb"><a href="index.html">← 课程主页</a></div>
    <h1>🃏 闪卡复习</h1>
    <p class="text-dim">SM-2 间隔重复算法 · 点击卡片翻面 · 选档评分</p>
  </header>

  <div class="card">
    <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
      <label>章节筛选:
        <select id="chapterFilter" style="margin-left: 6px; padding: 6px 10px; border-radius: 6px;">
          <option value="all">全部</option>
        </select>
      </label>
      <label style="margin-left: 12px;">
        <input type="checkbox" id="dueOnly"> 仅显示今日到期
      </label>
      <button class="btn btn-danger" id="resetBtn" style="margin-left: auto;">重置所有闪卡</button>
    </div>
    <div id="summaryStats" style="margin-top: 12px; color: var(--text-dim); font-size: 14px;"></div>
  </div>

  <div class="flashcard-area" id="cardArea">
    <div id="emptyState" style="display:none; padding: 40px; text-align: center; color: var(--text-dim);">
      📭 没有卡片
    </div>
    <div id="cardContent" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div id="cardPosition" style="color: var(--text-dim); font-size: 13px;">第 0/0 张</div>
        <button class="btn" id="flipBtn">翻面 (Space)</button>
      </div>
      <div class="flashcard" id="flashCard" style="cursor: pointer;">
        <div style="color: var(--text-dim); font-size: 12px;">📝 题目</div>
        <div class="flashcard-q" id="cardQuestion"></div>
      </div>
      <div id="answerArea" style="display:none; margin-top: 16px;">
        <div style="color: var(--text-dim); font-size: 12px; border-top: 1px solid var(--border); padding-top: 12px;">💡 答案</div>
        <div class="flashcard-a" id="cardAnswer" style="margin-top: 8px;"></div>
        <div class="rate-btn-row">
          <button class="btn btn-danger" data-rate="again">✗ 再来 (1)</button>
          <button class="btn btn-warning" data-rate="hard">⚠ 困难 (2)</button>
          <button class="btn btn-success" data-rate="good">✓ 掌握 (3)</button>
          <button class="btn btn-primary" data-rate="easy">⭐ 简单 (4)</button>
        </div>
      </div>
      <div style="display:flex; gap: 8px; margin-top: 20px;">
        <button class="btn" id="prevBtn">← 上一张</button>
        <button class="btn" id="nextBtn">下一张 →</button>
      </div>
    </div>
  </div>
</main>

<script src="../_shared/course-storage.js"></script>
  <script src="../_shared/course-cloud.js"></script>
<script src="../_shared/course-progress.js"></script>
<script src="../_shared/course-flashcard.js"></script>
<script src="../_shared/course-notes.js"></script>
<script src="../_shared/course-mistakes.js"></script>
<script src="../_shared/course-quiz.js"></script>
<script src="../_shared/course-theme.js"></script>
<script src="../_shared/course-app.js"></script>
<script src="../_shared/course-init.js"></script>
<script>
(async () => {
  const courseId = '__COURSE_ID__';
  const chaptersData = __CHAPTERS_DATA_PLACEHOLDER__;
  const flashcardsData = __FLASHCARDS_DATA_PLACEHOLDER__;
  const quizzesData = __QUIZZES_DATA_PLACEHOLDER__;

  CourseInit.runInline(courseId, chaptersData, flashcardsData, quizzesData);
  document.getElementById('topnav').innerHTML = CourseApp.renderTopnav('__COURSE_SLUG__', '__COURSE_TITLE__', 'flashcards');

  const allCards = flashcardsData.cards;
  let visibleCards = [...allCards];
  let currentIdx = 0;
  let flipped = false;

  // v1 统一字段:chapterId(章 id 字符串)/front/back;兼容旧字段 chapter/q/a
  function cardChapterId(c) { return c.chapterId != null ? String(c.chapterId) : String(c.chapter); }
  function cardFront(c) { return c.front != null ? c.front : c.q; }
  function cardBack(c) { return c.back != null ? c.back : c.a; }
  // 章 id → 章号(显示用)
  const chapterNumById = {};
  (chaptersData.chapters || []).forEach((ch, i) => { chapterNumById[String(ch.id)] = i + 1; });

  function applyFilter() {
    const ch = document.getElementById('chapterFilter').value;
    const dueOnly = document.getElementById('dueOnly').checked;
    visibleCards = allCards.filter(c => {
      if (ch !== 'all' && cardChapterId(c) !== ch) return false;
      if (dueOnly) {
        const mastery = CourseFlashcard.getAll().find(x => x.id === c.id)?.mastery;
        return mastery?.nextReview && mastery.nextReview <= Date.now();
      }
      return true;
    });
    currentIdx = 0;
    flipped = false;
    renderCard();
    updateSummary();
  }

  function updateSummary() {
    const sum = CourseFlashcard.summary();
    document.getElementById('summaryStats').innerHTML =
      '总 ' + sum.total + ' 张 · ' +
      '<span style="color: var(--success);">已掌握 ' + sum.mastered + '</span> · ' +
      '<span style="color: var(--warning);">学习中 ' + sum.learning + '</span> · ' +
      '今日到期 <strong>' + sum.due + '</strong> · ' +
      '今日新增 ' + sum.new + ' 张';
  }

  function renderCard() {
    if (visibleCards.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('cardContent').style.display = 'none';
      return;
    }
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('cardContent').style.display = 'block';
    const c = visibleCards[currentIdx];
    const mastery = CourseFlashcard.getAll().find(x => x.id === c.id)?.mastery;
    const statusLabel = mastery?.status === 'mastered' ? '✓ 已掌握' : mastery?.status === 'review' ? '◐ 复习' : mastery?.status === 'learning' ? '⋯ 学习中' : '○ 新卡';
    document.getElementById('cardPosition').textContent =
      '第 ' + (currentIdx + 1) + ' / ' + visibleCards.length + ' 张 · 第 ' + (chapterNumById[cardChapterId(c)] || '?') + ' 章 · ' + statusLabel;
    document.getElementById('cardQuestion').textContent = cardFront(c);
    const diffColor = c.difficulty === 'easy' ? 'var(--success)' : c.difficulty === 'medium' ? 'var(--warning)' : 'var(--danger)';
    document.getElementById('cardAnswer').innerHTML =
      '<div style="display:inline-block; padding: 2px 10px; border-radius: 12px; background: ' + diffColor + '; color: #fff; font-size: 12px; margin-bottom: 8px;">' +
      (c.difficulty || 'medium').toUpperCase() + '</div><div>' + cardBack(c) + '</div>';
    document.getElementById('answerArea').style.display = flipped ? 'block' : 'none';
    document.getElementById('flipBtn').textContent = flipped ? '翻回' : '翻面 (Space)';
    document.getElementById('prevBtn').disabled = currentIdx === 0;
    document.getElementById('nextBtn').disabled = currentIdx === visibleCards.length - 1;
  }

  function flip() {
    if (visibleCards.length === 0) return;
    flipped = !flipped;
    renderCard();
  }

  function next() {
    if (currentIdx < visibleCards.length - 1) {
      currentIdx++;
      flipped = false;
      renderCard();
    }
  }

  function prev() {
    if (currentIdx > 0) {
      currentIdx--;
      flipped = false;
      renderCard();
    }
  }

  function rate(r) {
    const c = visibleCards[currentIdx];
    CourseFlashcard.mark(c.id, r);
    // 仅显示到期模式:移除并重渲染
    if (document.getElementById('dueOnly').checked) {
      applyFilter();
    } else {
      next();
    }
    updateSummary();
  }

  document.getElementById('chapterFilter').innerHTML = '<option value="all">全部</option>' +
    chaptersData.chapters.map((c, i) => '<option value="' + c.id + '">第 ' + (i + 1) + ' 章 · ' + c.title + '</option>').join('');
  document.getElementById('chapterFilter').addEventListener('change', applyFilter);
  document.getElementById('dueOnly').addEventListener('change', applyFilter);
  document.getElementById('flipBtn').addEventListener('click', flip);
  document.getElementById('flashCard').addEventListener('click', flip);
  document.getElementById('nextBtn').addEventListener('click', next);
  document.getElementById('prevBtn').addEventListener('click', prev);
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('重置所有闪卡评分?')) {
      CourseFlashcard.reset();
      applyFilter();
    }
  });
  document.querySelectorAll('[data-rate]').forEach(btn => {
    btn.addEventListener('click', () => rate(btn.dataset.rate));
  });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); flip(); }
    else if (e.code === 'ArrowRight') next();
    else if (e.code === 'ArrowLeft') prev();
    else if (e.key === '1') rate('again');
    else if (e.key === '2') rate('hard');
    else if (e.key === '3') rate('good');
    else if (e.key === '4') rate('easy');
  });

  applyFilter();
})();
</script>
</body>
</html>
